<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR 受取テスト（開発用）</title>
  <style>
    body { margin: 0; background: #0b0d12; color: #e8ecf2; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    canvas { display: block; margin: 16px auto; max-width: 100%; image-rendering: pixelated; }
    code { word-break: break-all; color: #9aa6b8; }
    button { padding: 10px 22px; border: 0; border-radius: 999px; background: #3dd6ff; color: #04121a; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>QR 受取テスト</h1>
    <p>npm run serve で起動し、http://localhost:8000/dev/qr-test.html で開いてください。</p>
    <canvas id="qr" width="320" height="320"></canvas>
    <p id="status"></p>
    <p><code id="url"></code></p>
    <button id="make" type="button">もう一度作る</button>
  </main>
  <script type="module" src="qr-test.js"></script>
</body>
</html>
